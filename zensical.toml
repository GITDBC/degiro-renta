[project]
site_name = "Fiscalidad de las inversiones"
site_description = "Normativa del IRPF y de las obligaciones informativas que afectan a las inversiones en valores negociados."
site_author = "degiro-renta"
site_url = "https://gitdbc.github.io/degiro-renta/"
repo_url = "https://github.com/GITDBC/degiro-renta"
repo_name = "GITDBC/degiro-renta"
copyright = "Licencia MIT"
nav = [
    {"Inicio" = "index.md"},
    {"Renta del ahorro" = [
        "01_renta_ahorro/section_1_fundamentals.md",
        "01_renta_ahorro/section_2_ganancias_perdidas.md",
        "01_renta_ahorro/section_3_regla_dos_meses.md",
        "01_renta_ahorro/section_4_divisas.md",
        "01_renta_ahorro/section_5_rendimientos.md",
        "01_renta_ahorro/section_6_cuota_declaracion.md"
    ]},
    {"Otras obligaciones" = [
        "02_otras_obligaciones/section_1_modelo_720.md",
        "02_otras_obligaciones/section_2_patrimonio.md"
    ]},
    {"Cuestiones abiertas" = [
        "03_cuestiones_abiertas/section_1_fundamentals.md"
    ]},
    {"Herramienta" = [
        "04_herramienta/section_1_tratamiento_extracto.md"
    ]}
]
extra_css = ["assets/stylesheets/extra.css"]

[project.extra.version]
provider = "mike"
default = "latest"

[project.theme]
language = "es"
features = [
    "content.code.copy",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.sections",
    "navigation.tabs",
    "navigation.top",
    "search.highlight",
]

[[project.theme.palette]]
accent = "orange"
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
accent = "orange"
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[project.theme.icon]
repo = "fontawesome/brands/github"

[project.markdown_extensions.admonition]
[project.markdown_extensions.tables]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.md_in_html]

[project.markdown_extensions.toc]
permalink = true
toc_depth = 3

[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.superfences]
