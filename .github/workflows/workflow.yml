name: CI/CD Pipeline

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  lint-test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Install Python Dependencies
        run: uv sync

      - name: Lint with Ruff
        run: uv run ruff check degiro_renta/

      - name: Check Cognitive Complexity
        run: uv run complexipy -f degiro_renta/

      - name: Check Types with Mypy
        run: uv run mypy degiro_renta/

      - name: Run Tests with Pytest
        run: uv run pytest tests

  release:
    name: Create Release
    if: github.ref == 'refs/heads/main'
    needs: lint-test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      version: ${{ steps.release.outputs.version }}
      created: ${{ steps.release.outputs.created }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b

      - name: Create Release if the Version Has None
        id: release
        run: |
          VERSION="v$(uv version --short)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "created=false" >> "$GITHUB_OUTPUT"
          else
            gh release create "$VERSION" --title "$VERSION" --target "$GITHUB_SHA" --generate-notes
            echo "created=true" >> "$GITHUB_OUTPUT"
          fi

  build-binaries:
    name: Build ${{ matrix.artifact }}
    if: needs.release.outputs.created == 'true'
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: degiro-renta-linux
          - os: windows-latest
            artifact: degiro-renta-windows.exe
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          enable-cache: true

      - name: Install Python Dependencies
        run: uv sync --no-dev --no-group pipeline

      - name: Build Binary with PyInstaller
        run: uv run --with pyinstaller pyinstaller --onefile --name ${{ matrix.artifact }} --clean --hidden-import=fastexcel degiro_renta/__main__.py

      - name: Upload Binary to Release
        run: gh release upload "${{ needs.release.outputs.version }}" "dist/${{ matrix.artifact }}"
